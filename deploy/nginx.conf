# nginx server block for HGER — fully static site (next build && next export via output: "export")
#
# Setup:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hgeroadshow
#   sudo ln -s /etc/nginx/sites-available/hgeroadshow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run this BEFORE certbot (certbot rewrites this file to add the 443 server
# block and the HTTP->HTTPS redirect once the cert is issued).

server {
    listen 80;
    listen [::]:80;
    server_name hgeroadshow.com www.hgeroadshow.com;

    root /var/www/hgeroadshow;
    index index.html;

    # gzip only text formats — the media (mp4/png/jpg) is already compressed,
    # gzipping it again just burns CPU for no size win.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    sendfile on;
    tcp_nopush on;

    # /_next/static/* filenames are content-hashed by Next — safe to cache
    # forever. A new build ships new filenames, so this never serves stale JS/CSS.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (HTML documents) must revalidate every time, otherwise
    # a browser or intermediary cache can keep serving yesterday's deploy.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
